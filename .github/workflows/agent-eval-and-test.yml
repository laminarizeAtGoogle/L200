name: A2A Software Factory Tests & Evaluation Suite

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'factory/**'
      - 'feat/**'
  workflow_dispatch:

jobs:
  test-and-evaluate:
    name: Pytest & Golden Dataset Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies (Public PyPI on GitHub Runner)
        run: |
          mv uv.toml uv.toml.bak
          mv uv.lock uv.lock.bak
          uv sync --no-config
          mv uv.toml.bak uv.toml
          mv uv.lock.bak uv.lock

      - name: Run Unit & Integration Tests
        run: uv run --no-config --no-sync pytest -v

      - name: Run Golden Dataset Agent Evaluation Suite
        run: uv run --no-config --no-sync python evals/run_evaluation_suite.py
