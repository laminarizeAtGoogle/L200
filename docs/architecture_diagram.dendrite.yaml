# Dendrite Architecture Diagram Specification (go/dendrite)
# Project: Google Academy L200 & Gemini Enterprise Cloud Chat Agent Workspace
# Authoritative URL: http://go/dendrite
# Interactive Viewer: http://go/dendrite-playground
# Canonical DSL Model: docs/architecture_diagram.dendrite

dendrite_diagram:
  title: "Gemini Enterprise Cloud Chat Agent & Argolis Infrastructure Architecture"
  version: "3.3.0"
  standard: "Executive Standard v3.3"
  archetype: "BENTO-SANDWICH"
  dendrite_url: "http://go/dendrite"
  playground_url: "http://go/dendrite-playground"
  dsl_source: "docs/architecture_diagram.dendrite"
  description: >-
    End-to-end 2D Widescreen Bento-Sandwich architecture topology covering the Gemini
    Enterprise (GE) text/voice frontend, Google Identity-Aware Proxy (IAP) verification,
    Gemini 3.8 conversational agent with Cloud Text-to-Speech (TTS), strict database access
    quarantine guardrail, read-only GCP resource probing, and Cloud Logging integration.
  last_updated: "2026-09-29"

  boundaries:
    - id: "Zone1_Perimeter"
      label: "1. Gemini Enterprise Frontend & Ingress"
      type: "perimeter_zone"
      trust_level: "authenticated_internal"
      bento_area: "z1"
      components:
        - id: "ge_frontend"
          label: "Gemini Enterprise Web UI"
          type: "web_frontend"
          role: "Voice recording (Web Speech), markdown chat feed, TTS audio playback, IAP user badge"
        - id: "iap_gateway"
          label: "Identity-Aware Proxy (IAP)"
          type: "security_gateway"
          role: "Cryptographic JWT signature verification, audience validation, and caller authorization"
        - id: "cloudtop_shell"
          label: "Developer Shell & Toolchain"
          type: "dev_environment"
          role: "Local testing, pre-push sanitization hooks, and CLI administration"

    - id: "Zone2_AgentEngine"
      label: "2. Gemini 3.8 Agent Engine & Guardrails"
      type: "execution_zone"
      trust_level: "managed_agent_runtime"
      bento_area: "z2"
      components:
        - id: "cloud_chat_agent"
          label: "Gemini Enterprise Cloud Chat Agent"
          type: "ai_agent"
          role: "Single conversational coordinator powered by Gemini 3.8 Flash & Gemini 3.8 Pro"
        - id: "cloud_tts_engine"
          label: "Google Cloud Text-to-Speech (TTS)"
          type: "voice_synthesis"
          role: "Synthesizes high-fidelity Journey/Neural2 speech audio for real-time voice responses"
        - id: "db_quarantine_barrier"
          label: "Database Access Restriction Guardrail"
          type: "security_guardrail"
          role: "Strictly blocks direct SQL/Spanner/Firestore querying while routing audit traces to Cloud Logging"
        - id: "readonly_cloud_prober"
          label: "Read-Only Cloud Environment Tools"
          type: "tools_runtime"
          role: "Inspects Compute Engine VMs, Cloud Run services, Storage metadata, IAM roles, and Cloud Logging"

    - id: "Zone3_CicdAndIam"
      label: "3. GitHub CI/CD & WIF Security Boundary"
      type: "governance_zone"
      trust_level: "managed_external_and_iam"
      bento_area: "z3"
      components:
        - id: "github_repo"
          label: "GitHub Repository (L200 Mainline)"
          type: "vcs_repository"
          role: "Git source of truth with branch governance and PR review enforcement"
        - id: "agent_eval_pipeline"
          label: "CI/CD: agent-eval-and-test.yml"
          type: "ci_pipeline"
          role: "Automated pytest suite & 7-case Golden Evaluation Dataset measuring guardrails & accuracy"
        - id: "wif_pool"
          label: "Workload Identity Pool & Provider"
          type: "iam_wif"
          role: "Keyless OIDC federation for GitHub Actions to manage Argolis infrastructure"
        - id: "reader_sa"
          label: "Read-Only Inspection SA"
          type: "service_account"
          role: "cloudtop-agent-reader SA (strictly Viewer and Logging Viewer permissions only)"

    - id: "Zone4_ArgolisInfrastructure"
      label: "4. Google Cloud Argolis Infrastructure"
      type: "resource_foundation"
      trust_level: "cloud_resources"
      bento_area: "z4"
      components:
        - id: "cloud_run_factory_service"
          label: "Cloud Run Service & IAP Backend"
          type: "serverless_compute"
          role: "Hosts containerized GE Cloud Chat API behind Identity-Aware Proxy"
        - id: "cloud_logging"
          label: "Cloud Logging Systems"
          type: "observability_system"
          role: "Authorized diagnostic telemetry, application error logs, and audit trails"
        - id: "compute_vm"
          label: "Compute Engine & Cloud Run Workloads"
          type: "compute_engine"
          role: "Monitored infrastructure resources discovered by read-only tools"
        - id: "secret_manager_vault"
          label: "Secret Manager & Cloud DLP"
          type: "security_vault"
          role: "Zero hardcoded secrets + active PII scrubbing across logs and conversational memory"
        - id: "internal_databases"
          label: "Internal Application Databases"
          type: "isolated_databases"
          role: "Cloud SQL, Spanner & Firestore (Strictly Quarantined: Direct Agent Queries Prohibited)"

  connections:
    - from: "ge_frontend"
      to: "iap_gateway"
      protocol: "HTTPS"
      auth: "Google Login Cookie"
      label: "User Query"
      type: "control"

    - from: "iap_gateway"
      to: "cloud_chat_agent"
      protocol: "HTTPS / REST"
      auth: "IAP JWT Assertion"
      label: "Verified Identity"
      type: "auth"

    - from: "cloud_chat_agent"
      to: "cloud_tts_engine"
      protocol: "gRPC"
      auth: "Runtime SA Token"
      label: "TTS Synthesis"
      type: "data"

    - from: "cloud_chat_agent"
      to: "db_quarantine_barrier"
      protocol: "Internal Hook"
      auth: "Policy Plugin"
      label: "Enforce Isolation"
      type: "control"

    - from: "cloud_chat_agent"
      to: "readonly_cloud_prober"
      protocol: "ADK Tools"
      auth: "Least Privilege"
      label: "Read-Only Probes"
      type: "control"

    - from: "readonly_cloud_prober"
      to: "reader_sa"
      protocol: "GCP IAM API"
      auth: "SA Impersonation"
      label: "Impersonate"
      type: "auth"

    - from: "reader_sa"
      to: "compute_vm"
      protocol: "GCP Compute / Run APIs"
      auth: "Viewer Token"
      label: "Inspect State"
      type: "data"

    - from: "reader_sa"
      to: "cloud_logging"
      protocol: "Cloud Logging API"
      auth: "Logging Viewer"
      label: "Query Logs"
      type: "data"

    - from: "db_quarantine_barrier"
      to: "internal_databases"
      protocol: "BLOCKED"
      auth: "ACCESS DENIED"
      label: "Quarantine Wall"
      type: "control"

    - from: "github_repo"
      to: "agent_eval_pipeline"
      protocol: "GitHub Webhook"
      label: "On Push/PR"
      type: "event"

    - from: "agent_eval_pipeline"
      to: "wif_pool"
      protocol: "HTTPS"
      auth: "GitHub OIDC JWT"
      label: "OIDC Token"
      type: "auth"

    - from: "cloud_run_factory_service"
      to: "secret_manager_vault"
      protocol: "HTTPS / gRPC"
      auth: "Runtime SA Token"
      label: "Read Secrets"
      type: "data"
